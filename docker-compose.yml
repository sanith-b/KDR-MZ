version: "3.8"

services:
  bot:
    build: .
    command: ["python3", "bot.py"]
    restart: unless-stopped
    env_file: .env
    ports:
      - "8089:8089"
    depends_on:
      - redis

  api:
    build: .
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
